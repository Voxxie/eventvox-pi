name: Controle

# Bij elke push en pull request: de scripts (shellcheck, bash -n), update.sh met nagebootste pakketten en de agent tegen
# een echte Chromium met debugpoort (tests/agent.test.mjs). Lokaal: tests/run.sh
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright met Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Controles
        run: tests/run.sh
